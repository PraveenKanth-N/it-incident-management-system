# ==============================================================================
# RESOLV - Production Profile Configuration (application-prod.yml)
# ==============================================================================

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  # Production security: do not leak server banner or stack traces in HTTP errors
  error:
    include-stacktrace: never
    include-message: always

spring:
  # Production Datasource (Credentials injected strictly via environment variables)
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:incident_db}?useSSL=true&requireSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=false}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: ResolvProductionHikariCP
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  # Production JPA / Hibernate (Strict validation; zero DDL generation; no SQL in logs)
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false
    hibernate:
      ddl-auto: validate

  # Flyway Migrations (Deterministic, validated database migration)
  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    locations: classpath:db/migration

# Production Logging: High-signal, zero PII or SQL queries in production console
logging:
  level:
    root: INFO
    com.incident.system: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
    org.flywaydb: INFO

# Application Security Configuration
app:
  jwt:
    # In production, JWT_SECRET MUST be supplied via environment variable (no dev fallback key permitted)
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
