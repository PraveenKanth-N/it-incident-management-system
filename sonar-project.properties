# ==============================================================================
# RESOLV - SonarQube Project Analysis Configuration
# ==============================================================================

# Core Project Identification
sonar.projectKey=resolv-it-incident-system
sonar.projectName=RESOLV - IT Incident Management and Resolution System
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Source Code & Test File Directories
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src/__tests__

# Java Bytecode Binaries (Required for Java AST and Semantic Analysis)
sonar.java.binaries=backend/target/classes

# Code Coverage Integration Paths
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Global Analysis Exclusions (Dependencies, Generated Artifacts, Static Media)
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/target/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/src/__tests__/**,\
  **/db/migration/**,\
  **/*.css,\
  **/*.svg,\
  **/*.png,\
  **/*.ico,\
  **/*.html

# Test File Matching Inclusions
sonar.test.inclusions=\
  backend/src/test/java/**/*Test.java,\
  frontend/src/__tests__/**/*.test.ts,\
  frontend/src/__tests__/**/*.test.tsx

# Copy-Paste Detection (CPD) Exclusions for Boilerplate DTOs and Test Mocks
sonar.cpd.exclusions=\
  backend/src/test/**,\
  frontend/src/__tests__/**,\
  backend/src/main/java/com/incident/system/dto/**,\
  backend/src/main/java/com/incident/system/entity/**
